name: BatterySavePro
options:
  bundleIdPrefix: com.batterysavepro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only (optimized for iPhone 17 Pro)
    INFOPLIST_FILE: BatterySavePro/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.batterysavepro.iphone17pro
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO

targets:
  BatterySavePro:
    type: application
    platform: iOS
    sources:
      - path: BatterySavePro
    settings:
      base:
        PRODUCT_NAME: BatterySavePro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
